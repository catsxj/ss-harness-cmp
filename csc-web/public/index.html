<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>用户控制台</title>
    <!-- <link rel="stylesheet" href="/web-common-resource/css/loading.css" /> -->
    <style>
      .loading {
        position: absolute;
        top: 0;
        left: 0;
        text-align: center;
        line-height: 100vh;
        z-index: 10;
        height: 100vh;
        width: 100%;
        background: #fff;
      }

      @-webkit-keyframes line-scale-pulse-out {
        0% {
          -webkit-transform: scaley(1);
          transform: scaley(1);
        }

        50% {
          -webkit-transform: scaley(0.4);
          transform: scaley(0.4);
        }

        100% {
          -webkit-transform: scaley(1);
          transform: scaley(1);
        }
      }

      @keyframes line-scale-pulse-out {
        0% {
          -webkit-transform: scaley(1);
          transform: scaley(1);
        }

        50% {
          -webkit-transform: scaley(0.4);
          transform: scaley(0.4);
        }

        100% {
          -webkit-transform: scaley(1);
          transform: scaley(1);
        }
      }

      .line-scale-pulse-out > div {
        background-color: #279fcf;
        width: 4px;
        height: 35px;
        border-radius: 2px;
        margin: 2px;
        -webkit-animation-fill-mode: both;
        animation-fill-mode: both;
        display: inline-block;
        -webkit-animation: line-scale-pulse-out 0.9s 0s infinite cubic-bezier(0.85, 0.25, 0.37, 0.85);
        animation: line-scale-pulse-out 0.9s 0s infinite cubic-bezier(0.85, 0.25, 0.37, 0.85);
      }

      .line-scale-pulse-out > div:nth-child(2),
      .line-scale-pulse-out > div:nth-child(4) {
        -webkit-animation-delay: 0.2s !important;
        animation-delay: 0.2s !important;
      }

      .line-scale-pulse-out > div:nth-child(1),
      .line-scale-pulse-out > div:nth-child(5) {
        -webkit-animation-delay: 0.4s !important;
        animation-delay: 0.4s !important;
      }

      @-webkit-keyframes line-scale-pulse-out-rapid {
        0% {
          -webkit-transform: scaley(1);
          transform: scaley(1);
        }

        80% {
          -webkit-transform: scaley(0.3);
          transform: scaley(0.3);
        }

        90% {
          -webkit-transform: scaley(1);
          transform: scaley(1);
        }
      }

      @keyframes line-scale-pulse-out-rapid {
        0% {
          -webkit-transform: scaley(1);
          transform: scaley(1);
        }

        80% {
          -webkit-transform: scaley(0.3);
          transform: scaley(0.3);
        }

        90% {
          -webkit-transform: scaley(1);
          transform: scaley(1);
        }
      }

      .line-scale-pulse-out-rapid > div {
        background-color: #279fcf;
        width: 4px;
        height: 35px;
        border-radius: 2px;
        margin: 2px;
        -webkit-animation-fill-mode: both;
        animation-fill-mode: both;
        display: inline-block;
        -webkit-animation: line-scale-pulse-out-rapid 0.9s 0s infinite cubic-bezier(0.11, 0.49, 0.38, 0.78);
        animation: line-scale-pulse-out-rapid 0.9s 0s infinite cubic-bezier(0.11, 0.49, 0.38, 0.78);
      }

      .line-scale-pulse-out-rapid > div:nth-child(2),
      .line-scale-pulse-out-rapid > div:nth-child(4) {
        -webkit-animation-delay: 0.25s !important;
        animation-delay: 0.25s !important;
      }

      .line-scale-pulse-out-rapid > div:nth-child(1),
      .line-scale-pulse-out-rapid > div:nth-child(5) {
        -webkit-animation-delay: 0.5s !important;
        animation-delay: 0.5s !important;
      }
    </style>
  </head>

  <body id="cmp">
    <noscript>
      <strong>We're sorry but csc-web doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div class="loading">
      <div class="loader-inner line-scale-pulse-out-rapid">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="text/javascript" src="/static/config.js" defer></script>
    <!-- built files will be auto injected -->
  </body>
</html>
